<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Whykui RTX Demo</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.160.0",
                "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
                "simplex-noise": "https://esm.sh/simplex-noise@4.0.1",
                "nipplejs": "https://esm.sh/nipplejs@0.10.1"
            }
        }
    </script>
</head>
<body>
    <div id="loader">
        <div class="loader-content">
            <h1>GENERATING TERRAIN</h1>
            <div class="spinner"></div>
            <p>Baking Lighting...</p>
        </div>
    </div>

    <div id="hud">
        <div class="header">
            <span class="title">WHYKUI DEMO</span>
            <span id="fps">60 FPS</span>
        </div>
        <div class="controls-hint">
            Desktop: WASD + Drag | Mobile: Joystick + Drag
        </div>
        <div class="toggles">
            <button id="btn-rtx" class="chip active">RTX ON</button>
            <button id="btn-wind" class="chip active">WIND ON</button>
        </div>
    </div>

    <div id="zone-joystick"></div> <!-- Left side for movement -->
    <div id="zone-look"></div>     <!-- Right side for camera -->

    <script type="module" src="./src/main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
